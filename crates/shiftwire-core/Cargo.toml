[package]
name = "shiftwire-core"
description = "shiftWire domain logic: proxy, store, repeater, timeline. No web/UI code lives here."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
brotli-decompressor = "6"
bytes = "1"
flate2 = "1"
http-body-util = "0.1"
httparse = "1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "logging"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
regex = "1"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
ring = "0.17"
ruzstd = "0.9"
rusqlite = { version = "0.43", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde.workspace = true
time = "0.3"
tokio = { workspace = true, features = ["net", "io-util", "rt", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "0.9"
serde_json.workspace = true
tracing = "0.1"
ulid = "1"
webpki-roots = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
