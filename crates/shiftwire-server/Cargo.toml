[package]
name = "shiftwire-server"
description = "The `shiftwire` binary: daemon lifecycle, CLI, and the REST/WebSocket/MCP adapters over shiftwire-core."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "shiftwire"
path = "src/main.rs"

[dependencies]
shiftwire-core = { path = "../shiftwire-core" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
fd-lock = "4"
getrandom = "0.3"
rust-embed = { version = "8", features = ["mime-guess"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "process", "io-util"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "2", default-features = false, features = ["json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
